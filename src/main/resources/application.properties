spring.datasource.url=jdbc:sqlite:file:products?mode=memory&cache=shared
spring.datasource.driver-class-name=org.sqlite.JDBC
spring.datasource.hikari.maximum-pool-size=1
spring.datasource.hikari.minimum-idle=1
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false
spring.application.name=item-comparison-api
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=20s
app.seed-data=${APP_SEED_DATA:true}
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
management.endpoint.health.probes.enabled=true
management.endpoint.health.group.readiness.include=readinessState,db
logging.level.com.hackerrank.sample=${APP_LOG_LEVEL:INFO}
logging.pattern.level=%5p [requestId:%X{requestId:-}]
